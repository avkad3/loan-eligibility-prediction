name: Loan Prediction CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Test API import and model loading
        run: |
          python -c "from api import app; print('FastAPI application loaded successfully')"

      - name: Test API endpoints
        run: |
          python -c "from fastapi.testclient import TestClient; from api import app; c=TestClient(app); r=c.get('/health'); assert r.status_code == 200; assert r.json()['status'] == 'healthy'; print('Health endpoint test passed')"

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install ruff

      - name: Run lint check
        run: ruff check api.py

  version-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check tool versions
        run: |
          python --version
          pip --version
          python -c "import fastapi, sklearn, pandas, joblib; print('FastAPI:', fastapi.__version__); print('scikit-learn:', sklearn.__version__); print('pandas:', pandas.__version__); print('joblib:', joblib.__version__)"

  build:
    runs-on: ubuntu-latest
    needs: [test, lint, version-check]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t loan-prediction-api:ci .
